<!DOCTYPE html>
<html lang="th" class="overflow-x-hidden max-w-full">
<head>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            aura: {
              lime: '#A3E635',
              dark: '#0F172A',
              cardDark: '#1E1B4B',
              accent: '#38BDF8',
              surface: '#13172E'
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Prompt & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    html, body {
      max-width: 100%;
      overflow-x: hidden;
      font-family: 'Prompt', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Soft Pastel Light Mode Background */
    body.light-mode-theme {
      background: linear-gradient(135deg, #EEF2FF 0%, #FDF2F8 50%, #F0FDFA 100%) !important;
      background-attachment: fixed !important;
      color: #0f172a !important;
    }

    /* Floating Translucent Header */
    .floating-rounded-header {
      background: rgba(19, 23, 46, 0.58);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 32px -6px rgba(0, 0, 0, 0.4), inset 0 1px 0 0 rgba(255, 255, 255, 0.2);
    }
    .floating-rounded-header-light {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(203, 213, 225, 0.8);
      box-shadow: 0 10px 30px -8px rgba(15, 23, 42, 0.08), inset 0 1px 0 0 rgba(255, 255, 255, 0.95);
    }

    /* Inner Glass Capsules */
    .frozen-capsule-bg {
      background: rgba(27, 33, 68, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.18), 0 4px 12px -2px rgba(0, 0, 0, 0.3);
    }
    .frozen-capsule-bg-light {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(203, 213, 225, 0.85);
      box-shadow: 0 4px 12px -2px rgba(15, 23, 42, 0.06), inset 0 1px 0 0 rgba(255, 255, 255, 0.95);
    }

    /* Common Card Styling */
    .glass-card-dark {
      background: rgba(30, 27, 75, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-card-light {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 12px 32px -10px rgba(99, 102, 241, 0.08), 0 4px 12px -2px rgba(15, 23, 42, 0.04);
    }

    /* Raindrop Keyframe Animations for Cloudy/Rain Weather */
    @keyframes rainfall {
      0% {
        transform: translateY(-40px) translateX(0);
        opacity: 0;
      }
      20% {
        opacity: 0.85;
      }
      80% {
        opacity: 0.85;
      }
      100% {
        transform: translateY(180px) translateX(15px);
        opacity: 0;
      }
    }
    .raindrop-streak {
      position: absolute;
      width: 2px;
      height: 18px;
      background: linear-gradient(to bottom, rgba(56, 189, 248, 0.05), rgba(56, 189, 248, 0.75));
      border-radius: 9999px;
      animation: rainfall linear infinite;
      pointer-events: none;
    }
    .raindrop-streak-light {
      background: linear-gradient(to bottom, rgba(37, 99, 235, 0.05), rgba(37, 99, 235, 0.65));
    }

    /* Fluffy Floating Cloud Animation */
    @keyframes cloudFloat {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-4px) scale(1.02); }
    }
    .anim-cloud-float {
      animation: cloudFloat 4.2s ease-in-out infinite;
    }

    /* Fade-in for modal overlays */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.22s ease-out forwards;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

      const [meds, setMeds] = useState([
        { id: 1, name: 'Vitamin D3 2000 IU', time: '08:00 น.', taken: true },
        { id: 2, name: 'Omega-3 Fish Oil 1000mg', time: '12:00 น.', taken: false },
        { id: 3, name: 'Magnesium Glycinate', time: '21:30 น.', taken: false }
      ]);
      const [newMed, setNewMed] = useState('');

      const handleToggle = (id) => {
        setMeds(meds.map(m => m.id === id ? { ...m, taken: !m.taken } : m));
      };

      const handleAdd = (e) => {
        e.preventDefault();
        if (!newMed) return;
        setMeds([...meds, { id: Date.now(), name: newMed, time: '20:00 น.', taken: false }]);
        setNewMed('');
        setIsAddOpen(false);
      };

      return (
        <div className="space-y-4">
          <div className="flex justify-between items-center">
            <div>
              <h2 className={`text-xl sm:text-2xl font-black ${isDark ? 'text-white' : 'text-slate-900'}`}>
                ตารางเวลาทานยาและเวชภัณฑ์
              </h2>
              <p className="text-xs text-slate-400">ระบบเตือนอัตโนมัติพร้อมตัดสต็อกยาในครัวเรือน</p>
            </div>
            <button 
              onClick={() => {
                setIsAddOpen(true);
                window.scrollTo({ top: 0, behavior: 'instant' });
              }}
              className="px-4 py-2 bg-lime-400 text-slate-950 font-black text-xs rounded-xl hover:bg-lime-500 flex items-center gap-1.5"
            >
              <Icon name="plus" className="w-4 h-4 stroke-[3]" /> เพิ่มยาใหม่
            </button>
          </div>

          <div className="space-y-2.5">
            {meds.map(m => (
              <div 
                key={m.id}
                onClick={() => handleToggle(m.id)}
                className={`p-4 rounded-2xl border flex items-center justify-between cursor-pointer transition-all ${
                  isDark ? 'glass-card-dark' : 'glass-card-light'
                }`}
              >
                <div className="flex items-center gap-3">
                  <span className={`w-8 h-8 rounded-xl flex items-center justify-center text-sm ${
                    m.taken ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'
                  }`}>
                    {m.taken ? '✓' : '💊'}
                  </span>
                  <div>
                    <h4 className={`text-sm font-bold ${m.taken ? 'line-through text-slate-400' : ''}`}>{m.name}</h4>
                    <span className="text-xs text-slate-400">เวลาทาน: {m.time}</span>
                  </div>
                </div>
                <span className={`text-xs font-bold px-2.5 py-1 rounded-full ${
                  m.taken ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-800 text-slate-300'
                }`}>
                  {m.taken ? 'ทานแล้ว' : 'ยังไม่ทาน'}
                </span>
              </div>
            ))}
          </div>

          {/* TOP-CENTER ADD MED MODAL */}
          {isAddOpen && (
            <div 
              ref={(el) => { if (el) el.scrollTop = 0; }}
              className={`fixed inset-0 z-50 flex items-start justify-center pt-4 sm:pt-8 md:pt-10 px-3 sm:px-4 pb-12 overflow-y-auto backdrop-blur-md animate-fadeIn ${
                isDark ? 'bg-black/80' : 'bg-slate-900/50'
              }`}
            >
              <div className={`w-full max-w-md rounded-3xl border p-5 sm:p-6 space-y-4 shadow-2xl relative my-auto sm:my-0 ${
                isDark ? 'bg-slate-900 border-white/20 text-white' : 'bg-white border-slate-200 text-slate-900'
              }`}>
                <h3 className="text-base font-bold">เพิ่มยาใหม่</h3>
                <form onSubmit={handleAdd} className="space-y-3">
                  <input
                    type="text"
                    required
                    value={newMed}
                    onChange={(e) => setNewMed(e.target.value)}
                    placeholder="ชื่อยาหรือวิตามิน เช่น CoQ10 100mg"
                    className="w-full px-3 py-2 rounded-xl border bg-slate-800 border-slate-700 text-white text-xs outline-none"
                  />
                  <div className="flex gap-2">
                    <button type="submit" className="flex-1 py-2 bg-lime-400 text-slate-950 font-black text-xs rounded-xl hover:bg-lime-500">บันทึก</button>
                    <button type="button" onClick={() => setIsAddOpen(false)} className="px-4 py-2 bg-white/10 text-xs rounded-xl hover:bg-white/20">ยกเลิก</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==============================================================
    // 6. TELEMEDICINE MODULE (Doctor Video Consultations)
    // ==============================================================
    function TelemedModule({ isDark }) {
      return (
        <div className="space-y-4">
          <div>
            <h2 className={`text-xl sm:text-2xl font-black ${isDark ? 'text-white' : 'text-slate-900'}`}>
              ปรึกษาแพทย์และนักกายภาพออนไลน์ (Telemedicine)
            </h2>
            <p className="text-xs text-slate-400">วิดีโอคอลความคมชัดสูงพร้อมรับใบสั่งยาจัดส่งถึงบ้าน</p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {[
              { name: 'พญ. พรประภา (อายุรแพทย์โรคหัวใจ)', hosp: 'รพ. กรุงเทพ', status: 'พร้อมให้คำปรึกษา', img: 'https://images.unsplash.com/photo-1559839734-2b71ea197ec2?auto=format&fit=crop&w=400&q=80' },
              { name: 'นพ. วรเมธ (เวชศาสตร์ฟื้นฟูการกีฬา)', hosp: 'รพ. สมิติเวช', status: 'คิวถัดไป 14:00 น.', img: 'https://images.unsplash.com/photo-1622253692010-333f2da6031d?auto=format&fit=crop&w=400&q=80' }
            ].map((doc, idx) => (
              <div key={idx} className={`p-4 rounded-3xl border flex gap-3.5 items-center ${isDark ? 'glass-card-dark' : 'glass-card-light'}`}>
                <img src={doc.img} alt={doc.name} className="w-16 h-16 rounded-2xl object-cover" />
                <div className="flex-1 min-w-0">
                  <h4 className="font-bold text-sm truncate">{doc.name}</h4>
                  <p className="text-xs text-slate-400">{doc.hosp}</p>
                  <span className="inline-block mt-1 text-[10px] font-black px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400">
                    {doc.status}
                  </span>
                </div>
                <button 
                  onClick={() => alert(`เชื่อมต่อระบบวิดีโอคอลกับ ${doc.name}...`)}
                  className="px-3 py-2 bg-lime-400 text-slate-950 font-black text-xs rounded-xl hover:bg-lime-500"
                >
                  เริ่มปรึกษา
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
